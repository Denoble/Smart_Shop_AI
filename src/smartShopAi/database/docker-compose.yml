# docker-compose.yml

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: smartshop-postgres
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: smartshop
    ports:
      - "5432:5432"
    volumes:
      - smartshop_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: smartshop-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartshop.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  smartshop_data:


